{{- /* Tabelas Markdown dentro de um contêiner rolável: em telas estreitas a tabela rola na horizontal em vez de estourar a página. */ -}}
<div class="tabela-rolavel">
  <table>
    <thead>
      {{- range .THead }}
      <tr>
        {{- range . }}
        <th scope="col" {{- with .Alignment }} style="text-align: {{ . }}" {{- end }}>{{ .Text }}</th>
        {{- end }}
      </tr>
      {{- end }}
    </thead>
    <tbody>
      {{- range .TBody }}
      <tr>
        {{- range . }}
        <td {{- with .Alignment }} style="text-align: {{ . }}" {{- end }}>{{ .Text }}</td>
        {{- end }}
      </tr>
      {{- end }}
    </tbody>
  </table>
</div>

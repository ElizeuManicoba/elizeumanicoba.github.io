<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MyLife — Elizeu Maniçoba</title>
<meta name="description" content="Base de Operação pessoal de Elizeu Maniçoba: tarefas, hábitos, diário e projetos.">
<link rel="icon" type="image/svg+xml" href="/media/icon.svg">
<link rel="apple-touch-icon" href="/media/icon_hu_76a5a312578849f3.png">
<meta name="theme-color" content="#0d1117">
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#161b22; --muted:#5b6573; --line:#d8dce2; --blue:#2563eb; --blue-ink:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --card:#151b23; --text:#e8ecf1; --muted:#9aa5b1; --line:#262f3a; --blue:#4f8cff; --blue-ink:#07101f; }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--text);
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
  main { width:100%; max-width:420px; padding:36px 28px 28px; text-align:center;
         background:var(--card); border:1px solid var(--line); border-radius:16px; }
  .mark { font-size:2.2rem; line-height:1; margin-bottom:14px; }
  h1 { margin:0 0 4px; font-size:1.7rem; letter-spacing:-.03em; }
  .sub { margin:0 0 26px; color:var(--muted); font-size:.95rem; }
  .btn { display:block; padding:13px 18px; border-radius:10px; background:var(--blue); color:var(--blue-ink);
         font-weight:700; text-decoration:none; font-size:1rem; }
  .btn:hover { filter:brightness(1.08); }
  .btn:focus-visible, .back:focus-visible { outline:2px solid var(--blue); outline-offset:3px; }
  .note { margin:16px 0 0; color:var(--muted); font-size:.8rem; line-height:1.45; }
  .back { display:inline-block; margin-top:22px; color:var(--muted); font-size:.85rem; text-decoration:none; }
  .back:hover { color:var(--text); }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">🧭</div>
  <h1>MyLife</h1>
  <p class="sub">Base de Operação — Elizeu</p>
  <a class="btn" href="https://claude.ai/artifact/Y5F8u3Ki8b2KXLrwo5K1jp" rel="noopener">Abrir MyLife</a>
  <p class="note">Abre no Claude. É preciso estar logado na conta do Elizeu para ver e salvar os dados.</p>
  <a class="back" href="/">← elizeumanicoba.com.br</a>
</main>
</body>
</html>

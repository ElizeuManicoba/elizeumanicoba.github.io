hugoblox:
  schema: '2.0'

  identity:
    name: 'Elizeu Maniçoba'
    organization: 'Elizeu Maniçoba'
    type: person
    tagline: 'Economista · Professor universitário · Planejador Financeiro CFP®.'
    description: 'Site acadêmico-profissional de Elizeu Maniçoba: ensino, pesquisa, planejamento financeiro e artigos.'
    social:
      twitter: ''

  theme:
    mode: light
    pack: minimal
    colors:
      primary: '#1B3A4B'
      secondary: '#B08D57'
      neutral: zinc
    surfaces:
      background: '#FFFFFF'
      foreground: '#18181B'
      header:
        background: '#FFFFFF'
        foreground: '#18181B'
      footer:
        background: '#FAFAFA'
        foreground: '#52525B'

  typography:
    pack: geometric

  layout:
    radius: sm
    spacing: spacious
    avatar_shape: rounded

  header:
    enable: true
    style: navbar
    sticky: true
    align: right
    search: true
    theme_toggle: false
    theme_picker: false
    language_switcher: false
    show_logo: true
    show_title: false
    cta:
      enable: false

  footer:
    style: minimal
    language_switcher: false
    show_social: false
    text: |-
      **Elizeu Maniçoba**

      Economista · Professor universitário · Planejador Financeiro CFP®.

  copyright:
    notice: '© {year} {name}. Todos os direitos reservados.'
    license:
      type: custom
      label: ''
      url: ''

  seo:
    title: 'Elizeu Maniçoba — Economia, ensino e planejamento financeiro'
    ai:
      allow:
        - /
      disallow: []
      note: 'Conteúdo público para fins educacionais e profissionais.'
      contact: 'elizeumanicoba@outlook.com.br'

  content:
    math:
      enable: true
    toc:
      enable: true
    reading_time:
      enable: true
    citations:
      style: apa

  search:
    enable: true
    suggestions:
      - Estatística
      - Matemática financeira
      - Planejamento financeiro
      - IPS
    quick_actions: []

  comments:
    enable: false

  analytics:
    google:
      measurement_id: ''

  repository:
    enable: true
    url: 'https://github.com/ElizeuManicoba/elizeumanicoba.github.io'
    branch: main
    content_dir: content

  locale:
    date_format: '02/01/2006'
    time_format: '15:04'
    address_format: pt-br
